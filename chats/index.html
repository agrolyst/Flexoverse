<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6fa">
  <meta name="description" content="Private conversations with your Flexoverse friends.">
  <title>Chats · Flexoverse</title>
  <link rel="stylesheet" href="../assets/site.css?v=chat-group-call-ringtone-20261103">
</head>
<body data-page="chats">
  <div id="site-header"></div>
  <div class="page-layout">
    <aside id="left-sidebar"></aside>
    <main class="main-column chats-page">
      <section class="chat-page-heading">
        <div>
          <p class="overline">YOUR CONVERSATIONS</p>
          <h1>Messages</h1>
          <p class="muted">Private conversations with your friends.</p>
        </div>
        <button class="button button-primary" id="chat-new-button" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>New message</span></button>
      </section>
      <section class="chat-layout card" id="chat-layout" aria-label="Messages">
        <aside class="chat-inbox">
          <div class="chat-inbox-heading" id="chat-inbox-heading"><div><span class="chat-section-kicker">INBOX</span><h2>Your chats</h2></div><span class="chat-total" id="chat-total">0</span></div><div class="chat-selection-controls" id="chat-selection-controls"><button type="button" data-toggle-chat-selection>Select</button></div>
          <div class="chat-inbox-tabs"><button class="chat-inbox-tab active" id="chat-inbox-toggle" type="button">Chats</button><button class="chat-inbox-tab" id="call-log-toggle" type="button">Call logs</button></div>
          <label class="inbox-search" for="conversation-search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.3 4.3"/></svg><input id="conversation-search" type="search" placeholder="Search chats" aria-label="Search chats"></label>
          <div id="conversation-list" class="conversation-list" aria-live="polite"><div class="chat-loading"><span class="friends-loading-dot"></span>Loading conversations</div></div>
        </aside>
        <section class="chat-room" id="chat-room" aria-live="polite">
          <div class="chat-welcome"><span class="chat-welcome-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5 8.7 8.7 0 0 1-4-.95L3 21l1.95-5.5A8.5 8.5 0 1 1 21 11.5Z"/><path d="M8 12h.01M12 12h.01M16 12h.01"/></svg></span><strong>Your conversations, all in one place</strong><p>Choose a chat to catch up or start a new conversation with a friend.</p><button class="button button-soft" type="button" data-chat-new>Start a conversation</button></div>
        </section>
      </section>
      <p class="privacy-hint"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 1 1 8 0v3"/></svg>Messages are private to the people in each conversation.</p>
    </main>
    <aside id="right-sidebar"></aside>
  </div>
  <nav id="mobile-nav"></nav>
  <div id="modal-root"></div>
  <div id="call-root"></div>
  <div id="toast" role="status"></div>
  <script type="module" src="../assets/app.js?v=chat-groups-typing-20261103"></script>
</body>
</html>
