<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6fa">
  <title>Sign in · Flexoverse</title>
  <link rel="stylesheet" href="../assets/site.css">
</head>
<body data-page="login">
  <div id="site-header"></div>
  <div class="page-layout">
    <aside id="left-sidebar"></aside>
    <main class="main-column auth-page">
      <section class="auth-page-card card">
        <p class="overline">WELCOME BACK</p>
        <h1>Sign in to Flexoverse</h1>
        <p class="muted">Pick up where you left off with your circle.</p>
        <form id="login-form" class="auth-page-form">
          <label>Email address<input name="email" type="email" required autocomplete="email" placeholder="you@example.com"></label>
          <label>Password<input name="password" type="password" required autocomplete="current-password" placeholder="Your password"></label>
          <button class="button button-primary" type="submit">Sign in</button>
        </form>
        <p class="auth-page-switch">New to Flexoverse? <a id="switch-to-signup" href="/signup/">Create an account</a></p>
      </section>
    </main>
    <aside id="right-sidebar"></aside>
  </div>
  <nav id="mobile-nav"></nav>
  <div id="modal-root"></div>
  <div id="toast" role="status"></div>
  <script type="module" src="../assets/app.js"></script>
</body>
</html>
