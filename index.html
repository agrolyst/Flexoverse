<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6fa">
  <meta name="description" content="Flexoverse is a place for your people.">
  <title>Home · Flexoverse</title>
  <link rel="stylesheet" href="./assets/site.css?v=20261103-homefix">
</head>
<body data-page="home">
  <div id="site-header"></div>
  <div class="page-layout">
    <aside id="left-sidebar"></aside>
    <main class="main-column">
      <section class="welcome-row">
        <div>
          <p class="overline">YOUR COMMUNITY</p>
          <h1>Good to see you<span class="title-period">.</span></h1>
          <p class="muted">Catch up with the people who matter.</p>
        </div>
        <a class="button button-soft" href="/create/"><svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 5v14M5 12h14"/></svg><span>Create post</span></a>
      </section>
      <section class="composer card">
        <div class="composer-start">
          <span class="avatar avatar-blue" data-user-avatar>FX</span>
          <a class="composer-input" href="/create/">Share a moment with your circle…</a>
        </div>
        <div class="composer-tools">
          <span class="composer-hint">Share an update with your community</span>
          <a class="button button-primary" href="/create/"><svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L8 18l-4 1 1-4Z"/></svg><span>Write a post</span></a>
        </div>
      </section>
      <section class="feed-head">
        <div>
          <h2>Community feed</h2>
          <p class="muted">Latest public posts from Flexoverse members</p>
        </div>
        <span class="feed-sort-label">Newest first</span>
      </section>
      <div id="feed-list" class="feed-list" aria-live="polite">
        <div class="feed-state card">Loading community posts…</div>
      </div>
    </main>
    <aside id="right-sidebar"></aside>
  </div>
  <nav id="mobile-nav"></nav>
  <div id="modal-root"></div>
  <div id="toast" role="status"></div>
  <script type="module" src="./assets/app.js?v=20261103-homefix" onerror="document.querySelector('#feed-list')?.replaceChildren(Object.assign(document.createElement('div'),{className:'feed-state card',textContent:'Flexoverse could not load its app scripts. Please refresh the page.'}))"></script>
</body>
</html>
