<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6fa">
  <meta name="description" content="Watch short videos shared by the Flexoverse community.">
  <title>Reels · Flexoverse</title>
  <link rel="stylesheet" href="../assets/site.css">
</head>
<body data-page="reels">
  <div id="site-header"></div>
  <div class="page-layout">
    <aside id="left-sidebar"></aside>
    <main class="main-column reels-page">
      <section class="reels-page-heading">
        <div>
          <p class="overline">SHORT VIDEOS</p>
          <h1>Reels</h1>
          <p class="muted">Quick moments from people in your community.</p>
        </div>
        <a class="button button-primary reels-create-link" href="/reels/create/"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Create a reel</span></a>
      </section>
      <div class="reels-feed" id="reels-list" aria-label="Community reels" aria-live="polite">
        <div class="reels-loading" role="status"><span class="friends-loading-dot"></span>Loading community reels</div>
      </div>
    </main>
    <aside id="right-sidebar"></aside>
  </div>
  <nav id="mobile-nav"></nav>
  <div id="modal-root"></div>
  <div id="reel-viewer-root"></div>
  <div id="toast" role="status"></div>
  <script type="module" src="../assets/app.js"></script>
</body>
</html>
